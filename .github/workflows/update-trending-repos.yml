name: Daily GitHub Repos Star Update & Auto Page Rebuild

on:
  schedule:
    # Runs every night at 12:00 AM UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-and-rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Star Update Script
        run: python scripts/update_github_stars.py

      - name: Discover & Add New Trending Repos (AI-generated content)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAILY_REPO_LIMIT: '30'
          MIN_STARS: '1000'
          RISING_MIN_STARS: '250'
          RISING_SHARE: '0.5'
        run: python scripts/discover_and_add_repos.py

      - name: Build Astro Site & Dynamic Detail Pages
        run: |
          npm run build
          cp -r dist/* .

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update GitHub repo stars & rebuild pages [skip ci]" && git push)
