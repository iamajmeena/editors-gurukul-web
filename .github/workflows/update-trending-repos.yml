name: Daily GitHub Repos Star Update

on:
  schedule:
    # Runs every night at 12:00 AM UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Star Update Script
        run: python scripts/update_github_stars.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/trending-repos.ts
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update GitHub repository star counts [skip ci]" && git push)
